name: ridehailing

# =============================================================================
# Cách chạy (PowerShell, thư mục gốc dự án):
#   Chỉ hạ tầng:        docker compose up -d
#   Toàn bộ 7 service:  docker compose --profile apps up -d --build
#   Thêm replica WS:    docker compose --profile apps --profile ha up -d --build
#
# Cần có file .env (tạo bằng scripts/gen-env.ps1) với tối thiểu:
#   JWT_SECRET, INTERNAL_KEY
# Mật khẩu DB/Redis có giá trị mặc định cho máy local. Trên VPS PHẢI đặt trong .env.
# LƯU Ý: mật khẩu Postgres chỉ có tác dụng khi volume còn trống (lần khởi tạo đầu).
# =============================================================================

# ---- Khối dùng chung ---------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Biến môi trường chung của mọi service ứng dụng
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: infra
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
  TZ: UTC
  INTERNAL_KEY: ${INTERNAL_KEY:?Chưa đặt INTERNAL_KEY trong .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-ride}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-ride-local-only}

# Cấu hình chung của mọi service ứng dụng (profile apps)
x-app: &app
  profiles: [apps]
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging
  healthcheck:
    test: [CMD, /app/healthcheck.sh]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 60s

services:
  # ===========================================================================
  # HẠ TẦNG
  # ===========================================================================
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local-only}
      # Mật khẩu 4 role *_app, được script khởi tạo đọc để tạo database/role
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user-local-only}
      LOCATION_DB_PASSWORD: ${LOCATION_DB_PASSWORD:-location-local-only}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dispatch-local-only}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment-local-only}
      TZ: UTC
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # File .sh phải dùng đầu dòng LF (không phải CRLF)
      - ./infra/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      # Healthy khi Postgres sẵn sàng VÀ cả 4 database đã được tạo
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d platform &&
          [ "$$(psql -U postgres -d platform -tAc "SELECT count(*) = 4 FROM pg_database WHERE datname IN ('user','location','dispatch','payment')")" = "t" ]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.9-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
    # noeviction: khóa tài xế và stream sự kiện không được phép bị xóa khi đầy bộ nhớ
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$${REDIS_PASSWORD}"
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ride}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ride-local-only}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # ===========================================================================
  # 7 SERVICE ỨNG DỤNG
  # Không service nào publish cổng nội bộ ra host (xem compose.override.yaml cho dev).
  # Chỉ api-gateway (8000) và ws-gateway (8001) bind 127.0.0.1 để Nginx proxy.
  # ===========================================================================

  # --- user-service: tài khoản, hồ sơ tài xế, lịch sử chuyến ------------------
  user-service:
    <<: *app
    image: ridehailing/user-service:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: user-service}}
    environment:
      <<: *app-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/user
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD:-user-local-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      JWT_SECRET: ${JWT_SECRET:?Chưa đặt JWT_SECRET trong .env}
    mem_limit: 384m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # --- location-service: nhận GPS, Redis GEO, truy vấn tài xế gần --------------
  location-service:
    <<: *app
    image: ridehailing/location-service:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: location-service}}
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/location
      DB_USERNAME: location_app
      DB_PASSWORD: ${LOCATION_DB_PASSWORD:-location-local-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
    mem_limit: 384m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # --- pricing-service: báo giá, surge (không dùng Postgres) -------------------
  pricing-service:
    <<: *app
    image: ridehailing/pricing-service:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: pricing-service}}
    environment:
      <<: *app-env
      SERVER_PORT: 8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      LOCATION_SERVICE_URL: http://location-service:8082
    mem_limit: 256m
    depends_on:
      redis: {condition: service_healthy}
      location-service: {condition: service_healthy}

  # --- payment-service: ví, sổ cái, hoa hồng -----------------------------------
  payment-service:
    <<: *app
    image: ridehailing/payment-service:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: payment-service}}
    environment:
      <<: *app-env
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment-local-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-ride}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-ride-local-only}
      RABBITMQ_VHOST: /
    mem_limit: 384m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # --- ws-gateway: WebSocket hai chiều với app tài xế và khách -----------------
  # ws-gateway gọi dispatch-service lúc chạy (accept) nhưng KHÔNG khai báo
  # depends_on dispatch, vì dispatch đã phụ thuộc ws-gateway (tránh vòng lặp).
  ws-gateway:
    <<: *app
    image: ridehailing/ws-gateway:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: ws-gateway}}
    environment:
      <<: *app-env
      SERVER_PORT: 8001
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      JWT_SECRET: ${JWT_SECRET:?Chưa đặt JWT_SECRET trong .env}
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-ride}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-ride-local-only}
    ports: ["127.0.0.1:8001:8001"]
    mem_limit: 512m
    depends_on:
      redis: {condition: service_healthy}
      location-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # --- dispatch-service: chuyến xe, state machine, ghép chuyến -----------------
  dispatch-service:
    <<: *app
    image: ridehailing/dispatch-service:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: dispatch-service}}
    environment:
      <<: *app-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/dispatch
      DB_USERNAME: dispatch_app
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD:-dispatch-local-only}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      LOCATION_SERVICE_URL: http://location-service:8082
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      USER_SERVICE_URL: http://user-service:8081
      WS_GATEWAY_URL: http://ws-gateway:8001
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      location-service: {condition: service_healthy}
      pricing-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      ws-gateway: {condition: service_healthy}

  # --- api-gateway: cửa vào duy nhất cho REST ----------------------------------
  api-gateway:
    <<: *app
    image: ridehailing/api-gateway:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: api-gateway}}
    environment:
      <<: *app-env
      SERVER_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Chưa đặt JWT_SECRET trong .env}
      USER_SERVICE_URL: http://user-service:8081
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      # Danh sách origin được phép (phân tách bằng dấu phẩy); để trống = không bật CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 384m
    depends_on:
      user-service: {condition: service_healthy}
      dispatch-service: {condition: service_healthy}
      pricing-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}

  # --- ws-gateway-2: replica thứ hai (tùy chọn, profile ha) --------------------
  # Dùng khi cập nhật lần lượt từng replica sau Nginx upstream (8001 và 8011).
  # Chạy: docker compose --profile apps --profile ha up -d --build
  ws-gateway-2:
    <<: *app
    profiles: [ha]
    image: ridehailing/ws-gateway:${IMAGE_TAG:-local}
    build: {context: ., args: {MODULE: ws-gateway}}
    environment:
      <<: *app-env
      SERVER_PORT: 8011
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-only}
      JWT_SECRET: ${JWT_SECRET:?Chưa đặt JWT_SECRET trong .env}
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-ride}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-ride-local-only}
    ports: ["127.0.0.1:8011:8011"]
    mem_limit: 512m
    depends_on:
      redis: {condition: service_healthy}
      location-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: