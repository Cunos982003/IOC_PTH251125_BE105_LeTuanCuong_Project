services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      LOCATION_DB_PASSWORD: ${LOCATION_DB_PASSWORD}
      DISPATCH_DB_PASSWORD: ${DISPATCH_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    image: ghcr.io/cunos982003/ride-hailing-user-service:${IMAGE_TAG:-latest}
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/user
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  location-service:
    build:
      context: .
      args:
        MODULE: location-service
    image: ghcr.io/cunos982003/ride-hailing-location-service:${IMAGE_TAG:-latest}
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/location
      DB_USERNAME: location_app
      DB_PASSWORD: ${LOCATION_DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  dispatch-service:
    build:
      context: .
      args:
        MODULE: dispatch-service
    image: ghcr.io/cunos982003/ride-hailing-dispatch-service:${IMAGE_TAG:-latest}
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/dispatch
      DB_USERNAME: dispatch_app
      DB_PASSWORD: ${DISPATCH_DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  pricing-service:
    build:
      context: .
      args:
        MODULE: pricing-service
    image: ghcr.io/cunos982003/ride-hailing-pricing-service:${IMAGE_TAG:-latest}
