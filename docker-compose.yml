version: '3.9'

services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  # Services (profile: apps)
  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    image: ride-hailing-user-service:latest
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/user
      DB_USERNAME: user_app
      DB_PASSWORD: user_password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  location-service:
    build:
      context: .
      args:
        MODULE: location-service
    image: ride-hailing-location-service:latest
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/location
      DB_USERNAME: location_app
      DB_PASSWORD: location_password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  dispatch-service:
    build:
      context: .
      args:
        MODULE: dispatch-service
    image: ride-hailing-dispatch-service:latest
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/dispatch
      DB_USERNAME: dispatch_app
      DB_PASSWORD: dispatch_password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  pricing-service:
    build:
      context: .
      args:
        MODULE: pricing-service
    image: ride-hailing-pricing-service:latest
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - redis
      - rabbitmq
    profiles:
      - apps

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    image: ride-hailing-payment-service:latest
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/payment
      DB_USERNAME: payment_app
      DB_PASSWORD: payment_password
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - postgres
      - redis
      - rabbitmq
    profiles:
      - apps

  ws-gateway:
    build:
      context: .
      args:
        MODULE: ws-gateway
    image: ride-hailing-ws-gateway:latest
    ports:
      - "8001:8001"
    environment:
      SERVER_PORT: 8001
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
    depends_on:
      - redis
      - rabbitmq
    profiles:
      - apps

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    image: ride-hailing-api-gateway:latest
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      REDIS_HOST: redis
      REDIS_PASSWORD: redis_password_123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      USER_SERVICE_URL: http://user-service:8081
      LOCATION_SERVICE_URL: http://location-service:8082
      DISPATCH_SERVICE_URL: http://dispatch-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      WS_GATEWAY_URL: http://ws-gateway:8001
    depends_on:
      - redis
      - rabbitmq
    profiles:
      - apps

volumes:
  postgres-data:

networks:
  default:
    name: ride-hailing-network