server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

gateway:
  jwt-secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  user-service-url: ${USER_SERVICE_URL}
  dispatch-service-url: ${DISPATCH_SERVICE_URL}
  pricing-service-url: ${PRICING_SERVICE_URL}
  payment-service-url: ${PAYMENT_SERVICE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  rate-limit:
    auth-rpm: 60
    user-rpm: 300
  proxy:
    connect-timeout-ms: 1000
    read-timeout-ms: 5000
    read-timeout-create-ride-ms: 8000
    max-body-size-bytes: 65536

logging:
  level:
    com.ridehailing.apigateway: INFO
