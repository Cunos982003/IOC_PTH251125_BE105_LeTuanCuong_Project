server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true

gateway:
  jwt-secret: ${JWT_SECRET:test-jwt-secret-for-testing-only-min-256-bits-long}
  internal-key: ${INTERNAL_KEY:test-internal-key}
  user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  dispatch-service-url: ${DISPATCH_SERVICE_URL:http://localhost:8083}
  pricing-service-url: ${PRICING_SERVICE_URL:http://localhost:8084}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  rate-limit:
    auth-rpm: 50
    user-rpm: 100
  proxy:
    connect-timeout-ms: 1000
    read-timeout-ms: 500
    read-timeout-create-ride-ms: 2000
    max-body-size-bytes: 65536

logging:
  level:
    com.ridehailing.apigateway: WARN
