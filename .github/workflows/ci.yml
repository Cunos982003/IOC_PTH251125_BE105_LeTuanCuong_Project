name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Default permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

  contracts:
    name: Check Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check contract consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $PWD
          $services = @('user-service','location-service','dispatch-service','pricing-service','payment-service','ws-gateway','api-gateway')

          function Read-Contract([string]$path) {
              $full = Join-Path $root $path
              if (!(Test-Path -LiteralPath $full -PathType Leaf)) {
                  throw "Missing file: $path"
              }
              return ([IO.File]::ReadAllText($full)).Replace("`r`n", "`n").TrimEnd()
          }

          try {
              $manifest = Read-Contract 'docs/contracts/manifest.json' | ConvertFrom-Json
              $failed = @()
              $expected = @{}

              foreach ($entry in $manifest.contracts) {
                  foreach ($suffix in $entry.files) {
                      $source = "docs/contracts/$($entry.name)$suffix"
                      $expected[$source] = $true
                      $sourceText = Read-Contract $source

                      if ($source.EndsWith('.json')) {
                          $null = $sourceText | ConvertFrom-Json
                      }

                      foreach ($service in $entry.services) {
                          if ($services -notcontains $service) {
                              throw "Unknown service: $service"
                          }
                          $copy = "$service/src/test/resources/contracts/$($entry.name)$suffix"
                          $expected[$copy] = $true

                          try {
                              if ((Read-Contract $copy) -cne $sourceText) {
                                  $failed += "MISMATCH: $copy (source: $source)"
                              }
                          } catch {
                              $failed += $_.Exception.Message
                          }
                      }
                  }
              }

              $paths = @(Get-ChildItem (Join-Path $root 'docs/contracts') -Recurse -File | ForEach-Object {
                  $_.FullName.Substring($root.Path.Length + 1).Replace('\','/')
              })

              foreach ($service in $services) {
                  $dir = Join-Path $root "$service/src/test/resources/contracts"
                  if (Test-Path $dir) {
                      $paths += Get-ChildItem $dir -Recurse -File | ForEach-Object {
                          $_.FullName.Substring($root.Path.Length + 1).Replace('\','/')
                      }
                  }
              }

              foreach ($path in $paths) {
                  if ($path -match '^(docs/contracts/|[^/]+/src/test/resources/contracts/)' -and
                      $path -match '\.(json|md)$' -and
                      $path -notin @('docs/contracts/manifest.json','docs/contracts/README.md') -and
                      !$expected.ContainsKey($path)) {
                      $failed += "UNREGISTERED: $path"
                  }
              }

              if ($failed.Count) {
                  $failed | ForEach-Object { Write-Host "[FAIL] $_" -ForegroundColor Red }
                  exit 1
              }

              Write-Host '[OK] All registered contract copies match.' -ForegroundColor Green
              exit 0

          } catch {
              Write-Host "[FAIL] $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }

  images:
    name: Build Image - ${{ matrix.module }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        module:
          - user-service
          - location-service
          - dispatch-service
          - pricing-service
          - payment-service
          - ws-gateway
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            MODULE=${{ matrix.module }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/ride-hailing-${{ matrix.module }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/ride-hailing-${{ matrix.module }}:latest
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  