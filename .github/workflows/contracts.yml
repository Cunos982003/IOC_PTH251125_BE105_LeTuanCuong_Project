name: Contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check contract copies
        shell: pwsh
        run: ./scripts/check-contracts.ps1
      - name: Test all services
        run: mvn -B verify -DskipITs=false
      - name: Verify contract mutations
        shell: pwsh
        run: ./scripts/test-contract-mutations.ps1
