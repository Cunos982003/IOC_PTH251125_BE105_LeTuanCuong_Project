server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: pricing-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

pricing:
  base-fare: 12000
  per-km: 10000
  per-minute: 400
  min-fare: 20000
  distance-multiplier: 1.3
  avg-speed-kmh: 25

surge:
  demand-window-minutes: 3
  supply-radius-km: 3
  cache-seconds: 5
  grid-cell-degrees: 0.01
  demand-ttl-minutes: 10

location-service:
  url: ${LOCATION_SERVICE_URL:http://localhost:8082}
  timeout-ms: 500

internal:
  key: ${INTERNAL_KEY}

jwt:
  secret: ${JWT_SECRET}
