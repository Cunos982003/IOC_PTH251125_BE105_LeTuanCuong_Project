# Development override - publishes internal service ports to localhost for testing/benchmarking
# Usage: docker compose -f compose.yaml -f compose.override.yaml --profile apps up -d

services:
  user-service:
    ports: ["127.0.0.1:8081:8081"]

  location-service:
    ports: ["127.0.0.1:8082:8082"]

  dispatch-service:
    ports: ["127.0.0.1:8083:8083"]

  pricing-service:
    ports: ["127.0.0.1:8084:8084"]

  payment-service:
    ports: ["127.0.0.1:8085:8085"]